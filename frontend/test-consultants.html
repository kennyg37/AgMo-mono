<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Consultants API</title>
</head>
<body>
    <h1>Test Consultants API</h1>
    <button onclick="testConsultants()">Test Consultants API</button>
    <div id="result"></div>

    <script>
        async function testConsultants() {
            try {
                const response = await fetch('http://localhost:8000/api/consultations/consultants/');
                const data = await response.json();
                document.getElementById('result').innerHTML = `
                    <h2>Success!</h2>
                    <p>Found ${data.length} consultants:</p>
                    <ul>
                        ${data.map(consultant => `
                            <li>${consultant.name} - ${consultant.specialization} (${consultant.rating}★)</li>
                        `).join('')}
                    </ul>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h2>Error!</h2>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
