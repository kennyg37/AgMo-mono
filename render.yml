services:
  - type: web
    name: agmo-farm-backend
    env: python
    plan: starter
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      uvicorn agmo.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
    healthCheckPath: /health
    autoDeploy: true
    region: oregon

  - type: web
    name: agmo-farm-frontend
    env: static
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    region: oregon

databases:
  - name: agmo-farm-db
    databaseName: agmo_farm
    user: agmo_user
    plan: starter
    region: oregon
